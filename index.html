<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Football Strike</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; outline: none; }
        
        /* Game HUD */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        #score-board { position: absolute; top: 20px; left: 20px; color: white; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #FFD700; font-size: 80px; font-weight: bold; text-shadow: 4px 4px 8px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.3s; }
        #hint { position: absolute; bottom: 80px; width: 100%; text-align: center; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #player-avatar { position: absolute; top: 20px; right: 20px; width: 80px; height: 80px; border-radius: 50%; border: 4px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.5); object-fit: cover; background: white; }
        #back-btn { position: absolute; bottom: 20px; left: 20px; pointer-events: auto; padding: 12px 24px; background: rgba(0,0,0,0.6); color: white; border: 2px solid white; border-radius: 8px; font-size: 18px; cursor: pointer; text-transform: uppercase; font-weight: bold; backdrop-filter: blur(4px); }
        #back-btn:hover { background: rgba(255,255,255,0.3); }
        
        /* Main Menu */
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        h1 { color: white; font-size: 48px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 40px; text-align: center; }
        .char-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1000px; padding: 20px; max-height: 70vh; overflow-y: auto; }
        .char-grid::-webkit-scrollbar { width: 8px; }
        .char-grid::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.5); border-radius: 4px; }
        .char-card { background: white; border-radius: 12px; padding: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); width: 140px; }
        .char-card:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .char-card img { width: 120px; height: 120px; border-radius: 8px; object-fit: cover; margin-bottom: 10px; border: 1px solid #eee; }
        .char-card h3 { margin: 0; color: #333; font-size: 16px; font-weight: 800; text-transform: uppercase; }
        
        #next-btn { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); padding: 15px 40px; background: #FFD700; color: #000; border: none; border-radius: 30px; font-size: 24px; font-weight: bold; cursor: pointer; display: none; pointer-events: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: transform 0.1s; }
        #next-btn:active { transform: translate(-50%, -50%) scale(0.95); }
    </style>
    <script>
    window.onerror = function(msg, url, line, col, error) {
        let errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:absolute; top:0; left:0; background:white; color:red; z-index:9999; padding:20px; font-size:20px; border:2px solid red;';
        errDiv.innerHTML = `ERROR: ${msg}<br>Line: ${line}`;
        document.body.appendChild(errDiv);
    };
    </script>
    <script src="js/three.min.js"></script>
    <script src="js/GLTFLoader.js"></script>
    <script src="js/cannon.min.js"></script>
</head>
<body>

    <!-- Main Menu -->
    <div id="menu">
        <h1>CHOOSE YOUR COUNTRY</h1>
        <div class="char-grid">
            <div class="char-card" onclick="startGame('assets/brazil.jpg')">
                <img src="assets/brazil.jpg" alt="Brazil Player"><h3>BRAZIL</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/england.jpg')">
                <img src="assets/england.jpg" alt="England Player"><h3>ENGLAND</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/argentina.jpg')">
                <img src="assets/argentina.jpg" alt="Argentina Player"><h3>ARGENTINA</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/france.jpg')">
                <img src="assets/france.jpg" alt="France Player"><h3>FRANCE</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/germany.jpg')">
                <img src="assets/germany.jpg" alt="Germany Player"><h3>GERMANY</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/spain.jpg')">
                <img src="assets/spain.jpg" alt="Spain Player"><h3>SPAIN</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/italy.jpg')">
                <img src="assets/italy.jpg" alt="Italy Player"><h3>ITALY</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/netherlands.jpg')">
                <img src="assets/netherlands.jpg" alt="Netherlands Player"><h3>HOLLAND</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/portugal.jpg')">
                <img src="assets/portugal.jpg" alt="Portugal Player"><h3>PORTUGAL</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/usa.jpg')">
                <img src="assets/usa.jpg" alt="USA Player"><h3>USA</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/sweden.jpg')">
                <img src="assets/sweden.jpg" alt="Sweden Player"><h3>SWEDEN</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/norway.jpg')">
                <img src="assets/norway.jpg" alt="Norway Player"><h3>NORWAY</h3>
            </div>
            <div class="char-card" onclick="startGame('assets/mexico.jpg')">
                <img src="assets/mexico.jpg" alt="Mexico Player"><h3>MEXICO</h3>
            </div>
        </div>
    </div>

    <!-- Game HUD -->
    <div id="game-ui">
        <div id="score-board">SCORE: <span id="score">0</span></div>
        <img id="player-avatar" src="" alt="Avatar">
        <div id="msg">GOAL!</div>
        <div id="hint">Swipe UP to shoot! Curve your swipe to swerve the ball.</div>
        <button id="next-btn" onclick="nextShot()">NEXT SHOT</button>
        <button id="back-btn" onclick="showMenu()">Change Player</button>
    </div>

    <!-- Canvas will be injected by Three.js here -->
    <script src="js/game3d.js"></script>
</body>
</html>
