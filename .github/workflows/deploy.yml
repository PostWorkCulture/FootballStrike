name: Verify and deploy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check penalty rules
        run: npm test
      - name: Check desktop and touch gameplay
        run: npm run verify
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: verification/
          retention-days: 14
      - name: Prepare playable site
        run: |
          mkdir -p _site
          cp -R assets css js index.html legacy.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy verified game
        id: deployment
        uses: actions/deploy-pages@v4
