name: Verify international penalty game
on:
  push:
    branches: ["codex/international-penalty-overhaul"]
    paths-ignore: ["verification/**", "assets/international/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: international-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser dependencies
        run: npm ci
      - name: Deterministic gameplay checks
        run: npm test
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Build original 3D assets
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background --python-exit-code 1 --python tools/build_international_assets.py
          test -s assets/international/footballer.glb
          test -s assets/international/match-ball.glb
      - name: Verify desktop and mobile flows
        id: browser
        continue-on-error: true
        run: npm run verify
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: international-verification
          path: |
            verification/
            assets/international/
          retention-days: 14
      - name: Save generated assets and verification to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/international-penalty-overhaul'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/international verification package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Build Blender assets and record browser verification [skip ci]"
            git push origin HEAD:codex/international-penalty-overhaul
          fi
      - name: Require browser verification
        if: steps.browser.outcome != 'success'
        run: exit 1
